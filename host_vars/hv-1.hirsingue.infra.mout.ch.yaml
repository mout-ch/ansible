---
fqdn: hv-1.hirsingue.infra.mout.ch

# K3s
# Standalone cluster used as offsite backup target (S3 + backup cleanup)
k3s_release_version: v1.29.15+k3s1
k3s_server:
  # Cilium is the CNI, installed through files/k3s/cilium.yaml.j2
  flannel-backend: none
  disable-network-policy: true
  tls-san:
    - "hv-1.hirsingue.infra.mout.ch"
  default-local-storage-path: /var/lib/volumes/backup/k3s-local-path
k3s_server_manifests_templates:
  - ../files/k3s/cilium.yaml.j2

cilium_version: 1.16.19
cilium_values:
  kubeProxyReplacement: true
  # API server address, reachable before the service network exists
  k8sServiceHost: 192.168.1.67
  k8sServicePort: 6443
  operator:
    replicas: 1
  ipam:
    operator:
      # Same range as the k3s default cluster-cidr
      clusterPoolIPv4PodCIDRList:
        - 10.42.0.0/16

# Network
netplan_enabled: true
netplan_packages: netplan.io
# Drop the DHCP config written by cloud-init at install time
netplan_remove_existing: true
netplan_configuration:
  network:
    version: 2
    ethernets:
      eno1:
        match:
          macaddress: "74:46:a0:9e:b6:a6"
        set-name: eno1
        addresses:
          - 192.168.1.67/24
        routes:
          - to: default
            via: 192.168.1.1
        nameservers:
          addresses: [ 8.8.8.8, 8.8.4.4 ]
        dhcp4: false
        dhcp6: false

# Storage

## RAID
# sda + sdb (WD Red 2TB) mirrored for backups
# sdc: system disk (vg-root), sdd (WD RE 1TB, old): left unused
mdadm_arrays:
  - name: md0
    devices:
      - /dev/disk/by-id/ata-WDC_WD20EFRX-68EUZN0_WD-WCC4M2VKN452
      - /dev/disk/by-id/ata-WDC_WD20EFRX-68EUZN0_WD-WCC4M2VKN5TC
    level: '1'
    filesystem: xfs
    mountpoint: /var/lib/volumes/backup
    # Do not block boot if the array fails to assemble
    opts: defaults,nofail
    state: present

## LVM
manage_lvm: false
