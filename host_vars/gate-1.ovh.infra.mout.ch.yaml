---
fqdn: gate-1.ovh.infra.mout.ch

setup_type: "client"

# Client configuration.
client_wireguard_ip: 192.168.10.2/24
# The private cloud network.  Can also be a comma-separated list.
client_accessible_ips: "192.168.10.0/24,192.168.14.0/24"

# Server configuration.
server_public_ip: gate-1.blotzheim.infra.mout.ch
server_public_key: "{{ (lookup('ansible.builtin.url', mout_vault_addr ~ '/v1/mout.ch/data/wireguard/gate-1.blotzheim.infra.mout.ch', headers={'X-Vault-Token': mout_vault_token}, split_lines=false, validate_certs=false) | from_json).data.data['public_key'] }}"

# Not in the k3s group: without this the role installs the "stable" channel,
# newer than the server it joins. Keep it <= the server version.
k3s_release_version: v1.28.6+k3s2
k3s_registration_address: 192.168.14.21
k3s_control_token: "{{ (lookup('ansible.builtin.url', mout_vault_addr ~ '/v1/mout.ch/data/k3s/token', headers={'X-Vault-Token': mout_vault_token}, split_lines=false, validate_certs=false) | from_json).data.data['token'] }}"
k3s_control_node: false

netplan_enabled: true
netplan_configuration:
  network:
    version: 2
    ethernets:
      ens3:
        match:
          macaddress: "fa:16:3e:ff:49:61"
        addresses:
           - 152.228.139.220/32

           - 188.165.24.51/32
           - 94.23.73.226/32
           - 87.98.226.82/32
           - 188.165.136.129/32
           - 87.98.236.129/32
           - 188.165.0.194/32
           - 94.23.160.81/32

           - 94.23.147.108/32
           - 94.23.169.12/32
          # - 87.98.250.127/32
