---

# File and directory paths.
configuration_directory: "/etc/wireguard"
private_key_file_name: "privatekey"
private_key_file_path: "{{ configuration_directory }}/{{ private_key_file_name }}"
public_key_file_name: "publickey"
public_key_file_path: "{{ configuration_directory }}/{{ public_key_file_name }}"

unattended_upgrades_origins:
  - "packagecloud.io/netdata/netdata:${distro_codename}"

root_password_hashed: $6$PT9sMj9pMhJQI$Q8ZC2stxtIeFSCN6Fh3H/j5ygTScpgBjDaqy/UdHe1ohi4k232MYGXJAUBapH6KV.xpesB3WiQGXUMbxYFEdx.

bpf_tools_install: true

mail_server: mail.mout.ch

# Require to import ../vars/ssh_keys.yml as vars_files in the playbook needing the secret
ssh_authorized_keys:
  - "{{ ssh_key_rootmout.type }} {{ ssh_key_rootmout.key }} {{ ssh_key_rootmout.name }}"


loki_username: "none"  # yamllint disable-line rule:line-length
loki_password: "none"  # yamllint disable-line rule:line-length

promtail_url: "none"

alter_security_groups: false

#ansible_ssh_common_args: '-o ProxyCommand="ssh -W %h:%p -q root@gate-1.hirsingue.infra.mout.ch"'

### Ceph
ceph_release: reef

### Consul
consul_install_dependencies: false
consul_group_name: consul
consul_connect_enabled: true
consul_version: 1.11.2

### OpenBao
# Rolling upgrade, one node at a time: see docs/openbao/upgrade.md.
# The role installs whatever is set here: never lower it.
openbao_version: "2.7.1"
openbao_validate_certs: true
openbao_tls_disable: true
# Not /opt/openbao/data: the package's default config uses it for file storage
openbao_data_path: /opt/openbao/raft
openbao_server_directories:
  - "{{ openbao_data_path }}"
openbao_server_config: |
  cluster_name = "dc1"
  max_lease_ttl = "768h"
  default_lease_ttl = "768h"
  cluster_addr = "http://{{ ansible_facts['default_ipv4']['address'] }}:8201"
  api_addr = "{{ 'http' if openbao_tls_disable | bool else 'https' }}://{{ fqdn }}:8200"
  ui = true

  listener "tcp" {
    address = "{{ ansible_facts['default_ipv4']['address'] }}:8200"
    cluster_address = "{{ ansible_facts['default_ipv4']['address'] }}:8201"
    tls_disable = "{{ openbao_tls_disable | bool | lower }}"
  }

  listener "tcp" {
    address = "127.0.0.1:8200"
    cluster_address = "127.0.0.1:8201"
    tls_disable = "{{ openbao_tls_disable | bool | lower }}"
  }

  storage "raft" {
    path = "{{ openbao_data_path }}"
    node_id = "{{ inventory_hostname_short }}"
  {% for peer in groups['openbao'] if peer != inventory_hostname %}

    retry_join {
      leader_api_addr = "{{ 'http' if openbao_tls_disable | bool else 'https' }}://{{ hostvars[peer]['fqdn'] }}:8200"
    }
  {% endfor %}
  }

# OpenBao HTTP API, used from the controller (VAULT_ADDR / VAULT_TOKEN or ~/.vault-token)
mout_vault_addr: "{{ lookup('ansible.builtin.env', 'VAULT_ADDR') | regex_replace('/+$', '') }}"
mout_vault_token: "{{ lookup('ansible.builtin.env', 'VAULT_TOKEN') or lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') ~ '/.vault-token', errors='ignore') }}"
