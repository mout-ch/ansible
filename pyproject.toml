[tool.poetry]
name = "ansible-venv"
version = "0.1.0"
description = ""
authors = ["Pierre 'rootmout' Kelbert <rootmout@cri.epita.fr>"]
package-mode = false

[tool.poetry.dependencies]
# ansible-core 2.15 (ansible 8) does not support Python >= 3.12 as controller
python = ">=3.9,<3.12"
# napalm 4.1 still imports pkg_resources, removed from recent setuptools
setuptools = "<81"
jmespath = "^1.0.0"
netaddr = "^0.8.0"
napalm = "^4.1.0"
napalm-vyos = { git="https://github.com/rootmout/napalm-vyos", branch="develop" }
ansible = "^8.6.1"

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
