---
- hosts: all
  tags: fqdn
  tasks:
    - name: "Set hostname"
      ansible.builtin.hostname:
        name: "{{ fqdn }}"

- hosts: all
  roles:
    - cri.bootstrap
  tags:
    - bootstrap

- hosts: all
  gather_facts: true
  tags:
    - "always"
    - "gather_facts"

- hosts: all
  roles:
    - role: common
  tags:
    - common

- hosts: all
  roles:
    - role: cri.common
      tags:
        - common
    - role: cri.network
      tags:
        - network
  vars_files:
    - ../vars/ssh_keys.yml

- hosts: all:!ceph
  tags: node-exporter
  roles:
    - prometheus.prometheus.node_exporter

# One node at a time: a restarted node comes back sealed (shamir), and two
# sealed nodes means no raft quorum. Run with --limit, standbys first, see
# docs/openbao/upgrade.md.
- hosts: openbao
  serial: 1
  any_errors_fatal: true
  gather_facts: true
  tags: openbao
  pre_tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    # Leftovers of the Vault install replaced by OpenBao in October 2026,
    # including its data in /var/vault: rollback goes through a snapshot
    - name: Stop and disable Vault
      ansible.builtin.systemd:
        name: vault
        state: stopped
        enabled: false
      when: "'vault.service' in ansible_facts.services"

    - name: Remove Vault files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /lib/systemd/system/vault.service
        - /usr/local/bin/vault
        - /usr/local/lib/vault
        - /etc/vault.d
        - /var/vault
        - /var/log/vault
        - /var/run/vault
      register: vault_files

    - name: Reload systemd after removing the Vault unit
      ansible.builtin.systemd:
        daemon_reload: true
      when: vault_files is changed

    - name: Remove Vault user
      ansible.builtin.user:
        name: vault
        state: absent
        remove: true

  roles:
    - robertdebock.openbao
    - robertdebock.openbao_server

  post_tasks:
    - name: Run pending OpenBao restarts
      ansible.builtin.meta: flush_handlers

    - name: Get running OpenBao version
      ansible.builtin.uri:
        url: "http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"
      register: openbao_running
      failed_when: false
      # Read-only, keeps --check from predicting a restart
      check_mode: false

    # A package upgrade replaces the binary but leaves the old process running
    - name: Restart OpenBao to run {{ openbao_version }}
      ansible.builtin.systemd:
        name: openbao
        state: restarted
      when: openbao_running.json.version | default('') != openbao_version

    - name: Wait for the node to be unsealed (run `bao operator unseal` now)
      ansible.builtin.uri:
        url: "{{ 'http' if openbao_tls_disable | bool else 'https' }}://127.0.0.1:8200/v1/sys/health?standbyok=true"
        status_code: [200, 503]
      register: openbao_health
      until: openbao_health.status == 200
      retries: 90
      delay: 10
      check_mode: false

- hosts: gate
  tags: ip_forward
  tasks:
    - ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: yes
        state: present
        reload: yes

- hosts: vpn, theater-1.magstatt.infra.mout.ch
  tags: wireguard
  tasks:
    - name: get wireguard public key
      slurp:
        src: "{{ public_key_file_path }}"
      register: wireguard_public_key
      become: true
      ignore_errors: true
    - name: write wireguard public key to vault
      ansible.builtin.uri:
        url: "{{ mout_vault_addr }}/v1/mout.ch/data/wireguard/{{ inventory_hostname }}"
        method: POST
        headers:
          X-Vault-Token: "{{ mout_vault_token }}"
        body_format: json
        body:
          data:
            public_key: "{{ wireguard_public_key['content'] | b64decode }}"
        validate_certs: false
      delegate_to: localhost
      ignore_errors: true

- hosts: vpn, theater-1.magstatt.infra.mout.ch
  roles:
    - consensus.wireguard_cloud_gateway
  tags: vpn

- hosts: all
  any_errors_fatal: true
  tags: netplan
  roles:
    - role: mrlesmithjr.netplan
      become: yes

- hosts: ceph
  tags: docker
  roles:
    - cri.docker

- hosts: ceph
  tags: chrony
  roles:
    - mrlesmithjr.chrony

- hosts: ceph
  tags: cephadm
  roles:
    - cri.ceph_tools

- import_playbook: iptables.yaml

- hosts: compute-2.blotzheim.infra.mout.ch
  tags: [k3s-data, k3s]
  vars:
    volumes:
      - storj-0
      - storj-1
      - storj-2
      - storj-3
  tasks:
    - name: Ensure data folder exist
      file:
        path: "/mnt/{{ item }}"
        state: directory
      become: yes
      loop: "{{ volumes }}"

    - name: Mount compute-2-data volume
      mount:
        path: "/mnt/{{ item }}"
        src: "/dev/disk/by-id/virtio-{{ item }}"
        state: mounted
        opts: defaults
        fstype: xfs
      loop: "{{ volumes }}"

- hosts: k3s, gate-1.ovh.infra.mout.ch, theater-1.magstatt.infra.mout.ch
  tags: k3s
  roles:
     - role: xanmanning.k3s

- hosts: gate-1.infra.mout.ch
  tags: k3s
  vars:
    k3s_release_version: latest
  roles:
     - role: xanmanning.k3s

- hosts: gate-1.blotzheim.infra.mout.ch
  tags: ddns
  roles:
    - role: maxhoesel.ddclient

# LVM
- hosts: hypervisor, theater-1.magstatt.infra.mout.ch
  tags: lvm
  roles:
    - role: mrlesmithjr.lvm

# RAID
- hosts: hypervisor, backup
  tags: mdadm
  roles:
    - role: mrlesmithjr.mdadm
  post_tasks:
    # The role rebuilds the initramfs before writing mdadm.conf, so without
    # this the array may come back as md127 on reboot and md0 won't mount
    - name: Check if mdadm.conf is newer than the initramfs
      ansible.builtin.shell: test /etc/mdadm/mdadm.conf -nt "$(readlink -f /boot/initrd.img)"
      register: mdadm_conf_newer
      changed_when: false
      failed_when: false
      when: mdadm_arrays | default([]) | length > 0

    - name: Rebuild initramfs with RAID arrays
      ansible.builtin.command: update-initramfs -u
      when: mdadm_conf_newer.rc | default(1) == 0

- hosts: backup
  tags: backup
  tasks:
    # Keep cloud-init from rewriting netplan at boot
    - name: Disable cloud-init network configuration
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
        content: "network: {config: disabled}\n"
        mode: "0644"

    - name: Install smartmontools
      ansible.builtin.apt:
        name: smartmontools
        state: present
        update_cache: true

- hosts: backup
  tags: k3s
  roles:
     - role: xanmanning.k3s

# KVM
- hosts: hypervisor
  tags: kvm
  roles:
    - role: rootmout.kvm
  vars_files:
    - ../vars/ssh_keys.yml

# GRUB
- hosts: all
  tags: grub
  roles:
    - role: robertdebock.grub

- hosts: compute-2.blotzheim.infra.mout.ch, theater-1.magstatt.infra.mout.ch
  tags: vault-operator
  tasks:
    - name: Install Python3 and pip3
      apt:
        name:
          - python3
          - python3-venv
        state: present
        update_cache: true

    - name: Create a Python virtual environment
      ansible.builtin.command:
        cmd: python3 -m venv /opt/k8s_venv
      args:
        creates: /opt/k8s_venv

    - name: Install pip in the virtual environment
      ansible.builtin.command:
        cmd: /opt/k8s_venv/bin/pip install --upgrade pip

    - name: Install Kubernetes Python client in virtual environment
      ansible.builtin.command:
        cmd: /opt/k8s_venv/bin/pip install kubernetes
      args:
        creates: /opt/k8s_venv/bin/kubernetes

    # Periodic tokens have no max TTL: the operator renews them every 12h
    # forever. Orphan so they don't die with the token that created them.
    - name: Ensure Vault token role for the operator
      ansible.builtin.uri:
        url: "{{ mout_vault_addr }}/v1/auth/token/roles/vault-secrets-operator"
        method: POST
        headers:
          X-Vault-Token: "{{ mout_vault_token }}"
        body_format: json
        body:
          allowed_policies:
            - vault-secrets-operator
          orphan: true
          renewable: true
          period: 24h
        status_code: 204
        validate_certs: false
      delegate_to: localhost
      run_once: true

    - name: Create Vault operator token
      ansible.builtin.uri:
        url: "{{ mout_vault_addr }}/v1/auth/token/create/vault-secrets-operator"
        method: POST
        headers:
          X-Vault-Token: "{{ mout_vault_token }}"
        body_format: json
        body:
          policies:
            - vault-secrets-operator
        validate_certs: false
      register: vault_operator_token
      delegate_to: localhost
      no_log: true

    - name: Create and inject Vault operator token in k3s
      vars:
        ansible_python_interpreter: /opt/k8s_venv/bin/python
      environment:
        PATH: "/opt/k8s_venv/bin:{{ ansible_env.PATH }}"
        VIRTUAL_ENV: "/opt/k8s_venv"
      kubernetes.core.k8s:
        state: present
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: vault-secrets-operator
            namespace: vault-operator
          type: Opaque
          data:
            VAULT_TOKEN: "{{ vault_operator_token.json.auth.client_token | b64encode }}"
            VAULT_TOKEN_LEASE_DURATION: "{{ 86400 | b64encode }}"
      register: vault_operator_secret
      no_log: true

    # The operator reads VAULT_TOKEN from env at startup only
    - name: Restart Vault operator to load the new token
      vars:
        ansible_python_interpreter: /opt/k8s_venv/bin/python
      environment:
        PATH: "/opt/k8s_venv/bin:{{ ansible_env.PATH }}"
        VIRTUAL_ENV: "/opt/k8s_venv"
      kubernetes.core.k8s:
        state: patched
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        kind: Deployment
        name: "{{ vault_operator_deployment | default('vault-operator-vault-secrets-operator') }}"
        namespace: vault-operator
        definition:
          spec:
            template:
              metadata:
                annotations:
                  mout.ch/restarted-at: "{{ now(utc=true).isoformat() }}"
      when: vault_operator_secret.changed


- hosts: theater-1.magstatt.infra.mout.ch
  tags: folders
  tasks:
    - name: Ensure folders exist in /var/lib/volumes
      file:
        path: "/var/lib/volumes/media/{{ item }}"
        state: directory
        mode: "0777"
      loop:
        - downloads/incomplete
        - downloads/complete
        - downloads/torrents
        - movies/radarr
        - series/sonarr

- hosts: theater-1.magstatt.infra.mout.ch
  tags: k3s-secret
  tasks:
    - name: Read the kubeconfig file from the remote machine
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml #TODO could be variabilized
      register: k3s_kubeconfig_raw

    - name: Decode and parse the base64-encoded kubeconfig content
      set_fact:
        k3s_kubeconfig: "{{ k3s_kubeconfig_raw.content | b64decode | from_yaml }}"

    - name: Write k3s_kubeconfig to vault
      ansible.builtin.uri:
        url: "{{ mout_vault_addr }}/v1/mout.ch/data/k3s/{{ inventory_hostname }}"
        method: POST
        headers:
          X-Vault-Token: "{{ mout_vault_token }}"
        body_format: json
        body:
          data:
            ca: "{{ k3s_kubeconfig.clusters[0].cluster['certificate-authority-data'] | b64decode }}"
            cert: "{{ k3s_kubeconfig.users[0].user['client-certificate-data'] | b64decode }}"
            key: "{{ k3s_kubeconfig.users[0].user['client-key-data'] | b64decode }}"
        validate_certs: false
      delegate_to: localhost
      no_log: true
      ignore_errors: true

- hosts: theater-1.magstatt.infra.mout.ch
  tags: nfs
  roles:
    - role: mrlesmithjr.nfs-server
