- hosts: compute-2.blotzheim.infra.mout.ch
  tags: [k3s-data, k3s]
  vars:
    volumes:
      - storj-0
      - storj-1
      - storj-2
      - storj-3
  # storj is abandoned: unmount and drop the fstab entries, then remove this play
  tasks:
    - name: Unmount storj volumes and remove them from fstab
      mount:
        path: "/mnt/{{ item }}"
        state: absent
      loop: "{{ volumes }}"

    - name: Remove storj mount points
      file:
        path: "/mnt/{{ item }}"
        state: absent
      loop: "{{ volumes }}"

